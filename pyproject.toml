[project]
name = "snow-bot"
version = "0.1.0"
description = "Telegram-Bot für Snow AI und Agent Teacher auf Claude Managed Agents, plus Gratis-Modus."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-telegram-bot>=22",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
snow-bot = "snow_bot.__main__:main"
snow-bot-setup = "snow_bot.setup_agents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snow_bot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
